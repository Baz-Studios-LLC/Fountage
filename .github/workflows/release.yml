name: Preview builds
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested v001 prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            binary: prototypes/slint/target/release/fountage-slint-lab
          - runner: macos-15-intel
            platform: macos
            arch: x64
            binary: prototypes/slint/target/release/fountage-slint-lab
          - runner: windows-latest
            platform: windows
            arch: x64
            binary: prototypes/slint/target/release/fountage-slint-lab.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            prototypes/slint
      - name: Core tests
        run: cargo test --locked --lib
      - name: Mac generated-editor tests
        if: matrix.platform == 'macos'
        run: cargo test --locked --manifest-path prototypes/slint/Cargo.toml
      - name: Windows ordinary project lifecycle
        if: matrix.platform == 'windows'
        run: cargo test --locked --manifest-path prototypes/slint/Cargo.toml project_draft::tests::starter_projects_recover_and_reopen_all_categories_without_overwrite
      - name: Build release binary
        run: cargo build --locked --release --manifest-path prototypes/slint/Cargo.toml
      - name: Windows window startup and normal close
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SLINT_BACKEND: winit-software
        run: |
          $app = Start-Process -FilePath '${{ matrix.binary }}' -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          do {
            Start-Sleep -Milliseconds 300
            $app.Refresh()
            if ($app.HasExited) { throw 'Fountage exited before creating its window' }
          } while (($app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -notmatch 'Fountage') -and (Get-Date) -lt $deadline)
          if ($app.MainWindowHandle -eq 0 -or $app.MainWindowTitle -notmatch 'Fountage') {
            $app | Format-List Id, ProcessName, MainWindowHandle, MainWindowTitle, Responding
            Stop-Process -Id $app.Id
            throw 'No titled Fountage window appeared'
          }
          Write-Output $app.MainWindowTitle
          if (-not $app.CloseMainWindow()) { throw 'Window refused normal close' }
          if (-not $app.WaitForExit(15000)) { Stop-Process -Id $app.Id; throw 'Clean startup window did not close' }
          if ($app.ExitCode -ne 0) { throw "App exit code $($app.ExitCode)" }
      - name: Package preview
        run: python scripts/package-release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --binary ${{ matrix.binary }}
      - name: Verify Mac archive and project package declaration
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          version=$(cat VERSION)
          ditto -x -k "dist/Fountage-$version-macos-${{ matrix.arch }}.zip" "$RUNNER_TEMP/fountage-package"
          app="$RUNNER_TEMP/fountage-package/Fountage-$version-macos-${{ matrix.arch }}/Fountage.app"
          codesign --verify --deep --strict "$app"
          test -x "$app/Contents/MacOS/Fountage"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          swift -e 'import UniformTypeIdentifiers; guard let type = UTType(filenameExtension: "fountage", conformingTo: .package), type.identifier == "com.bazstudios.fountage.project", type.conforms(to: .package) else { fatalError("Fountage package type is not registered") }; print(type.identifier)'
      - name: Build and check per-user Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $staging = Join-Path $env:RUNNER_TEMP 'fountage-package'
          Expand-Archive -Path "dist/Fountage-$version-windows-x64.zip" -DestinationPath $staging
          $source = Join-Path $staging "Fountage-$version-windows-x64"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup is missing from the runner' }
          & $iscc "/DSourceDir=$source" "/DReleaseLabel=$version" packaging/windows/fountage.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setup = (Resolve-Path "dist/Fountage-$version-windows-x64-setup.exe").Path
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Fountage'
          if (-not (Test-Path (Join-Path $installed 'Fountage.exe'))) { throw 'Installer did not install app' }
          if (-not (Test-Path (Join-Path $installed 'THIRD-PARTY-LICENSES/inventory.json'))) { throw 'Installer did not retain notices' }
          Start-Process (Join-Path $installed 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path (Join-Path $installed 'Fountage.exe')) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path (Join-Path $installed 'Fountage.exe')) { throw 'Uninstall left executable behind' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content -Encoding ascii "$setup.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: Fountage-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish v001 prerelease from the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          test "$version" = v001
          gh release create "$version" dist/* --target "$GITHUB_SHA" --prerelease --title "Fountage $version — development preview" --notes-file docs/PREVIEW_RELEASE.md
