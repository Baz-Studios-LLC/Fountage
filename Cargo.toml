[package]
name = "fountage"
version = "0.1.0"
edition = "2024"
description = "Fountage by Baz Studios — a native screenwriting studio"

[dependencies]
iced = { version = "0.14", features = ["tokio"], optional = true }
rfd = { version = "0.15", optional = true }
tempfile = "3"
renamore = "=0.3.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.28.0", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }

[lib]
name = "fountage_core"
crate-type = ["staticlib", "rlib"]

[features]
ice-prototype = ["dep:iced", "dep:rfd"]

[[bin]]
name = "fountage-prototype"
path = "src/main.rs"
required-features = ["ice-prototype"]
